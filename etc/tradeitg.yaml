# Prometheus 指标采集：go-zero 会另起一个独立 HTTP 端口暴露 /metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics

# 链路追踪：go-zero 通过 OTLP 协议发送 trace 到 Tempo
Telemetry:
  Name: trade_itg
  Endpoint: tempo:4318
  Batcher: otlphttp
  Sampler: 1.0

# AccessLog: 请求/响应日志记录(按字段名脱敏)
AccessLog:
  Enable: true
  SensitiveFields:
    - password
    - user_token
    - old_password
    - new_password
    - pay_password