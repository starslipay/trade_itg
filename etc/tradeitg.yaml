Name: tradeitg.rpc
ListenOn: 0.0.0.0:8080
Timeout: 10000
# 关闭服务端熔断(其它中间件保持默认开启)
Middlewares:
  Breaker: false
Etcd:
  Hosts:
    - etcd:2379
    # - etcd-0.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-1.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-2.etcd.pay-ns.svc.cluster.local:2379
  Key: tradeitg.rpc

UserMgrRpcConfig:
  Etcd:
    Hosts:
    - etcd:2379
    # - etcd-0.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-1.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-2.etcd.pay-ns.svc.cluster.local:2379
    Key: usermgr.rpc  # 注册到etcd的服务key，客户端要对应这个key
  Timeout: 10000  # 超时时间，单位毫秒
  Middlewares:
    Breaker: false  # 关闭客户端熔断

